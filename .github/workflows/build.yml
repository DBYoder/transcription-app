name: Build app

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # to update the "Latest build" release
    env:
      # The keystore file (a repository secret) is what keeps the signing key private;
      # its password only satisfies the file format.
      SIGNING_STORE_PASSWORD: transcribe-signing
      SIGNING_KEY_ALIAS: transcribe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :core:test

      - name: Set up signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::The SIGNING_KEYSTORE_BASE64 secret isn't set, so this APK is signed with a throwaway key and won't be published. See README.md."
          fi

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Check the app has no network access
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -E 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE|CHANGE_WIFI_STATE)' permissions.txt; then
            echo "::error::The APK asks for network access. This app must stay fully offline."
            exit 1
          fi
          cp "$APK" transcribe.apk
          ls -lh transcribe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: transcribe-apk
          path: transcribe.apk
          if-no-files-found: error

      # One always-current download link for the phone:
      # https://github.com/<owner>/<repo>/releases/download/latest-build/transcribe.apk
      - name: Publish "Latest build" release
        if: github.event_name != 'pull_request' && env.SIGNING_KEYSTORE_PATH
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=latest-build
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          NOTES="Built from \`$GITHUB_REF_NAME\` at ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC') (build $GITHUB_RUN_NUMBER).

          On your phone, download **transcribe.apk** below and open it to install or update."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Latest build" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" --title "Latest build" --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" transcribe.apk --clobber
